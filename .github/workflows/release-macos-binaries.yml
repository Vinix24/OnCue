name: Release macOS binaries

# Builds whisper-cli, whisper-server and audiotee once for Apple Silicon and
# attaches them to the release, so users never need a compiler.
# GitHub-hosted runner only, with no runner switch like the one in ci.yml.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          submodules: recursive

      - name: Build binaries
        run: bash scripts/build_macos_binaries.sh "$RUNNER_TEMP/oncue-out"

      - name: Upload to release
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/oncue-out/oncue-macos-arm64.tar.gz" \
            "$RUNNER_TEMP/oncue-out/oncue-macos-arm64.tar.gz.sha256" \
            --clobber --repo "$GITHUB_REPOSITORY"
