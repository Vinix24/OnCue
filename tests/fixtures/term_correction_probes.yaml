    text: "Het pakket heet Sophie en draait op de server."
    terms: [Sofi, Bram]
    occurrences:
      - {source: "Sophie", correct_to: Sofi}
  - id: vba-vs-vwa
    text: "De macro in Excel is geschreven in VWA door een stagiair."
    terms: [VBA]
    occurrences:
