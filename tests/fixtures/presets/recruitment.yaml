# Test-only fixture preset — NOT the real recruitment pack.
# Exists so the consent-tier ladder (strict default) is tested against fixture
# content, not the real Pro pack, which is absent from the OSS export.
default_consent_tier: strict
pain_points:
  routes:
    - name: fixture-pijn
      utterances:
        - "fixture pijnzin een"
        - "fixture pijnzin twee"
        - "fixture pijnzin drie"
objections:
