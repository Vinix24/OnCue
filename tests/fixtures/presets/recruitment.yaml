    - name: fixture-bezwaar
      utterances:
        - "fixture bezwaar een"
        - "fixture bezwaar twee"
        - "fixture bezwaar drie"
buying_signals:
  routes:
    - name: fixture-signaal
      utterances:
        - "fixture signaal een"
        - "fixture signaal twee"
        - "fixture signaal drie"
doubts:
  routes:
    - name: fixture-twijfel
      utterances:
        - "fixture twijfel een"
        - "fixture twijfel twee"
        - "fixture twijfel drie"
ui_labels:
  prospect: fixture-kandidaat
  self: fixture-consultant
system_prompt_addendum: "fixture addendum"
