# Fase-B model register: the fixed panel from the fase-A shootout (PR #63),
# re-run at grote-N via scripts/run_fase_b.py against the real NL Fireflies data.
#
# Schema consumed by sales_copilot.modules.detector.eval_shared.load_model_register:
# a top-level ``models`` list of {provider, model, description}. Cross-check every
# provider:model string against config/eval_model_prices.yaml before adding a row —
# the pricing table only resolves exact (or provider-wildcard) matches.
models:
  - provider: vertex
    model: gemini-2.5-flash
    description: BYO-tenant Vertex AI Gemini 2.5 Flash (Google Application Default Credentials).
  - provider: openai
    model: gpt-4o
    description: OpenAI GPT-4o, frontier reference point for the shootout.
  - provider: openai
    model: gpt-4o-mini
    description: OpenAI GPT-4o-mini, cheap cloud baseline.
  - provider: openrouter
    model: "qwen/qwen3.6-35b-a3b"
    description: Qwen3.6-35B-A3B via OpenRouter -- 35B total / ~3B active MoE, native function-calling + structured output; local/Spark deployment candidate (replaces fase-A 30B-A3B).
  - provider: openrouter
    model: "mistralai/mistral-small-3.2-24b-instruct"
    description: Mistral Small 3.2 24B via OpenRouter, open-weight cost/quality reference.
  - provider: openrouter
    model: "anthropic/claude-haiku-4.5"
    description: Claude Haiku 4.5 via OpenRouter -- fase-B B3 suggestion/rebuttal eval winner for the general/Sales tier (p50 3.1s / p95 4.3s, Claude-tier quality, non-reasoning pre-4.6); wired as the live production default.
