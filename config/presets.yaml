presets:
  - name: discovery
    label: Discovery
    description: Alleen talk-time coaching, geen slides
    screen_mode: single
    transcript:
      backend: whisper.cpp
    modules:
      talk_time: true
      transcript: true
      pain_points: false
      presentation: false
      post_call_report: true
  - name: full_demo
    label: Full Demo
    description: Complete live copilot met transcript, pain points en slides
    screen_mode: dual
    transcript:
      backend: whisper.cpp
    modules:
      talk_time: true
      transcript: true
      pain_points: true
      presentation: true
      post_call_report: true
  - name: coaching_only
    label: Coaching Only
    description: Alleen live coaching metrics zonder detector of slides
    screen_mode: single
    transcript:
      backend: whisper.cpp
    modules:
      talk_time: true
      transcript: true
      pain_points: false
      presentation: false
      post_call_report: true
  - name: pitch
    label: Pitch
    description: Pitch-focused preset met alle modules ingeschakeld
    screen_mode: dual
    transcript:
      backend: whisper.cpp
    modules:
      talk_time: true
      transcript: true
      pain_points: true
      presentation: true
      post_call_report: true
    llm_model: anthropic/claude-haiku-4.5
  - name: notetaker
    label: Notetaker
    description: Notulist, alleen live transcript en verslag, ook van je eigen stem. Geen detectie, geen talk-time coaching, geen slides
    screen_mode: single
    transcript:
      backend: whisper.cpp
      transcribe_self_live: true
    modules:
      talk_time: false
      transcript: true
      pain_points: false
      presentation: false
      post_call_report: true
    # A notetaker has no seller and no prospect. No named roles: the readable transcript
    # (<prefix>_transcript.md) names the two channels neutrally by LANGUAGE ("Ik" and
    # "Gesprekspartner" in Dutch, "Me" and "Other" in English).
    ui_labels: {}
