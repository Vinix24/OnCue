  - propositie
  - voorstel
  - lead
  - leads
  - prospect
  - pipeline
  - funnel
  - forecast
  - CRM
  - ERP
  - upsell
  - cross-sell
  - deal
  - deals
  - closing
  - contract
  - overeenkomst
  - onboarding
  - implementatie
