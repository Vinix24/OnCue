# Default NL-B2B vocabulary biasing for the local transcription backends.
#
# This file feeds domain terms into Whisper's `initial_prompt` (or the closest
# equivalent that a backend supports). It is NOT a hardcoded list in code:
# deployments can edit, replace or disable it via WHISPER_VOCABULARY_CONFIG /
# WHISPER_VOCABULARY_ENABLED in .env.
#
# HARD BUDGET — READ BEFORE ADDING TERMS
# Whisper's decoder context is n_text_ctx = 448 tokens and it reserves half of
# that for the prompt, minus one: 223 tokens. whisper.cpp keeps the LAST tokens
# and silently drops the head (src/whisper.cpp:7097), so an over-budget list
# loses its opening terms AND the framing sentence, with no warning in the log.
# Measured 2026-08-25: the previous 97-term list rendered to 354 tokens, so 131
# tokens were dropped every single inference — the entire framing sentence plus
# Salesforce through "proof of concept". This list is 200 tokens, 23 to spare.
#
# Selection rule: only include terms Whisper would otherwise get WRONG. Ordinary
# Dutch words it already transcribes correctly ("voorstel", "contract",
# "management") spend budget and buy nothing. Prefer proper nouns, acronyms and
# compound jargon. Re-measure after edits — see scripts/benchmark_transcription.py.

enabled: true
language: nl
description: >
  Compact Dutch B2B / sales vocabulary used to bias local Whisper inference
  without fine-tuning. Kept under Whisper's 223-token prompt budget so every
  term in this file actually reaches the model.

prompt_prefix: "Nederlands zakelijke verkoopgesprek tussen Vincent en Steffy. Belangrijke termen:"

terms:
  # --- Eigennamen en producttermen uit deze omgeving ---
  - OnCue
  - Steffy
  - Vincent
  - SalesMinds
  - copilot
  - transcriptie
  - live transcriptie

  # --- NL-software die Whisper structureel verhaspelt ---
  - AFAS
  - Visma
  - Twinfield
  - Booqable
  - Simplicate
  - Teamleader
  - Exact
  - Salesforce
  - HubSpot
  - Pipedrive

  # --- Acroniemen ---
  - CRM
  - ERP
  - ROI
  - TCO
  - MRR
  - ARR
  - AVG
  - GDPR

  # --- Sales-jargon dat Whisper mis hoort ---
  - offerte
  - propositie
  - pijnpunt
  - pijnpunten
  - bezwaar
  - bezwaren
  - upsell
  - cross-sell
  - churn
  - retentie
  - onboarding
  - implementatie
  - livegang
  - proof of concept
  - business case
  - budgethouder

  # --- Samengestelde termen uit operatie en finance ---
  - ziekteverzuim
  - debiteurenbeheer
  - voorraadbeheer
  - inkoopproces
  - accountantskantoor
  - compliance
