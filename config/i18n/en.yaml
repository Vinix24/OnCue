  detail_subprocess_stopped_early: "subprocess stopped before the first frame"
  calltap_binary_missing: "AudioTee binary not found ({path}); the prospect call tap cannot start."
  calltap_process_not_found: "Telephony process '{process}' not found. Start a call (or check that avconferenced is running) and try again."
  detail_process_not_running: "'{process}' is not running"
  calltap_start_failed: "Could not start the AudioTee call tap for '{process}'."
  calltap_stopped_again: "The AudioTee call tap for '{process}' stopped again; giving up."
