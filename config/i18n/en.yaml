audio:
  # Tap health warnings and transcript markers (src/sales_copilot/audio/tap_health.py, capture.py).
  kind_mic: "microphone"
  kind_tap: "tap"
  no_frames_mic: "The {label} microphone is open ({target}) but has delivered no audio frame at all for {seconds} seconds. That is not silence: an open microphone keeps passing buffers, even when nobody speaks. Stop the call and start it again; if this keeps happening, check the microphone permission (System Settings > Privacy & Security > Microphone)."
  no_frames_tap: "The {label} tap is open ({target}) but has delivered no audio frame at all for {seconds} seconds. That is not silence: an open tap keeps passing buffers, even when nothing is playing. Stop the call and start it again; if this keeps happening, check the macOS permission for Core Audio process taps (System Settings > Privacy & Security)."
  silent_mic: "The {label} microphone is open ({target}) and delivers audio, but there has been no signal at all since the start of the call ({frames} frames, all digital silence, peak {peak} dBFS). Three causes are realistic: the microphone is muted (hardware or in the app), the wrong input device is selected ({target}; for example a virtual device instead of your headset), or the app has no microphone permission (System Settings > Privacy & Security > Microphone)."
  silent_tap: "The {label} tap is open ({target}) and delivers audio, but there has been no signal at all since the start of the call ({frames} frames, all digital silence, peak {peak} dBFS). Two causes are realistic: the call audio plays on another device (phone, second laptop) instead of this Mac, or this Mac's output is muted. The tap itself is fine."
  peer_signal: " The {peer} channel does carry signal in the same period. So this is not silence in the conversation but a fault in this {kind}."
  signal_lost: "The {label} {kind} ({target}) carried audio earlier in this call and has now delivered nothing but exact zeros for {seconds} seconds ({frames} frames). A live {kind} on a quiet source always gives a noise floor. Exact zero means the source is no longer delivering.{peer} Everything this side says from now on is lost. Stop the call and start it again."
  tap_lost_peer: " The {peer} channel does carry signal, so this is not silence in the conversation."
  tap_lost_reattaching: "The {label} {kind} ({target}) has delivered nothing but exact zeros for {seconds} seconds.{peer} What this side says now is lost. The system is trying to reconnect the {kind}."
  tap_recovered: "The {label} {kind} delivers signal again after {attempts} reconnect attempt(s). What was said between the dropout and now is not in the transcript."
  tap_gave_up: "The {label} {kind} ({target}) still delivers nothing but exact zeros after {attempts} reconnect attempt(s). Everything this side says is lost. Check the sound output, or stop and start the live coach again."
  reattach_marker: "[The {label} tap ({target}) delivered only digital silence and is being reattached (attempt {attempt}/{max_attempts}).]"
  signal_lost_marker_peer: " The {peer} channel keeps going."
  signal_lost_marker: "[Audio missing from here: the {label} tap no longer delivers a signal.{peer} What this side says after this is not in this transcript.]"
  detached: "The {label} tap dropped out during the call{detail} after {frames} frames. No audio is coming in any more. Stop the call and start it again."
  no_audio_stream: "No audio from the {label} stream (device={device}). Check your microphone and audio routing."
  no_tap: "The {label} tap is not open ({attach_state}{detail}). There is no source to listen to, so this is not silence. Check the audio permission and start the call again."
  no_frames_yet: "The {label} tap is open ({target}) but has not delivered a single frame yet. If that stays so, the tap is hung; stop the call and start it again."
  meeting_apps_ambiguous: "Several meeting apps are active at once ({apps}); the copilot cannot choose which one is the call. Close the apps you are not using, or set TARGET_PROCESS_NAME in .env. Prospect audio falls back to BlackHole."
  meeting_app_not_found: "No meeting app found (Google Chrome / Microsoft Teams / zoom.us). Open Google Meet, Microsoft Teams or Zoom before you start the call, or set TARGET_PROCESS_NAME in .env. Prospect audio falls back to BlackHole."
  tap_setup_failed: "AudioTee could not start an audio tap for '{process}'{detail}. Most common cause: the macOS permission for Core Audio process taps is missing. Grant it under System Settings > Privacy & Security > Audio Recording (macOS 14.4+) and start the call again. Until then the prospect stream stays silent."
  binary_missing: "AudioTee binary not found ({path}); the prospect tap cannot start."
  no_target_process: "No target process is set for the AudioTee prospect tap and no meeting app was detected automatically."
  target_gone: "Meeting app '{process}' not found (any more). Open the app and start the call again."
  start_failed: "Could not start AudioTee ({path})."
  no_pipes: "The AudioTee subprocess has no stdout/stderr pipes."
  tap_stopped: "The AudioTee tap ({device}) stopped during the call after {frames} frames{detail}. No prospect audio is coming in any more. The tap is restarted automatically; until then the prospect track records silence."
  all_processes: "all processes"
  unknown_process: "unknown process"
  calltap_needs_pro: "Phone-call capture via AudioTee requires a valid Sales Pro license."
  # Attach-failure details and call-tap / WASAPI warnings (capture.py, calltap.py, wasapi.py).
  detail_inputstream_open_failed: "InputStream could not be opened"
  detail_inputstream_open_failed_on: "InputStream could not be opened on '{device}'"
  detail_binary_missing: "binary missing"
  detail_no_target_process: "no target process"
  detail_target_not_found: "target process '{process}' not found"
  detail_subprocess_start_failed: "subprocess could not start"
  detail_no_pipes: "no stdout/stderr pipes"
