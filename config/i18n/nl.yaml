  signal_lost: "De {label}-{kind} ({target}) droeg eerder in dit gesprek audio en levert nu al {seconds} seconden uitsluitend exacte nullen ({frames} frames). Een levende {kind} van een stille bron geeft altijd een ruisvloer. Exact nul betekent dat de bron niets meer aanlevert.{peer} Alles wat deze kant vanaf nu zegt gaat verloren. Stop het gesprek en start het opnieuw."
