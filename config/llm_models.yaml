# Setup-step choices, one entry per privacy tier:
#   local         -> ollama
#   own tenant    -> azure, vertex
#   public        -> openrouter (one key, many models)
# The openai/groq/gemini paths in llm_client.py keep working for existing .env files
# but are not offered here.
providers:
  ollama:
    label: Ollama (local)
    models:
      - qwen2.5:7b
      - llama3.2:latest
      - mistral:7b
  azure:
    label: Azure OpenAI (own tenant)
    models:
      - gpt-4o
      - gpt-4o-mini
  vertex:
    label: Vertex AI (own tenant)
    models:
      - gemini-2.5-flash
      - gemini-2.5-pro
  openrouter:
    label: OpenRouter (public, default)
    models:
      - anthropic/claude-haiku-4.5
      - anthropic/claude-sonnet-5
